# Central Configuration for Phase 3: Graph Neural Network Experiments

experiment:
  name: "phase3_gnn_fraud_detection"
  seeds: [42, 123, 456, 789, 999]
  primary_direction: "forward"

splits:
  train_timesteps: [1, 34]
  val_timesteps: [35, 39]
  test_timesteps: [40, 49]

models:
  gcn:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.3
    lr: 0.001
    weight_decay: 0.0001
    epochs: 100
    patience: 20
  graphsage:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.3
    aggr: "mean"
    lr: 0.001
    weight_decay: 0.0001
    epochs: 100
    patience: 20
  gat:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.3
    heads: 8
    lr: 0.001
    weight_decay: 0.0001
    epochs: 100
    patience: 20

ablations:
  unknown_nodes: ["retained", "removed"]
  directions: ["forward", "backward", "bidirectional"]
  depths: [1, 2, 3]
  feature_modes: ["local", "full"]
